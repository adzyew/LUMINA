[providers]
# Ensure we use a modern Node version for Tailwind v4 and Vite
node = "20"
# Match your composer.json PHP requirement
php = "8.4" 

[phases.install]
# Install PHP dependencies first, then Node dependencies
cmds = [
    "composer install --optimize-autoloader --no-dev --no-interaction",
    "npm install"
]

[phases.build]
# Run Vite to compile your frontend assets
cmds = [
    "npm run build"
]

[start]
# Run migrations + caching, then start the server
cmd = "php artisan migrate --force && php artisan storage:link --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
